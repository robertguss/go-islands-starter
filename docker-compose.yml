name: go-islands-starter
services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: islands
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-migrations-only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d islands']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
